name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing v-prefixed tag to publish; empty input builds verified artifacts only"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: codex-auth-switcher-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Four-platform quality checks
    uses: ./.github/workflows/quality.yml
    with:
      ref: ${{ inputs.release_tag || github.sha }}
    permissions:
      contents: read

  package-windows:
    name: Package (Windows x64)
    needs: quality
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Read Rust toolchain from rust-toolchain.toml
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)"
          [[ -n "$toolchain" ]]
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}

      - name: Initialize and verify Windows MSVC/CMake environment
        shell: pwsh
        run: .\scripts\enable-windows-msvc.ps1

      - name: Report toolchain and architecture
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustup run stable rustc -vV | sed -n 's/^host: //p')
          [[ "$host" == "x86_64-pc-windows-msvc" ]]
          rustup run stable rustc -Vv
          rustup run stable cargo -V
          uname -m

      - name: Restore Cargo download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Prepare Inno Setup 6.7.4
        shell: pwsh
        run: .\scripts\windows\prepare-innosetup.ps1

      - name: Build, install, launch, and uninstall the Windows package
        shell: pwsh
        run: .\scripts\package-windows.ps1 -SmokeTest

      - name: Test the native Windows UI
        shell: pwsh
        run: .\scripts\test-v2-native-ui.ps1 -ExecutablePath .\target\release\codex-auth-switcher.exe

      - name: Upload verified Windows package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-auth-switcher-windows-${{ github.run_id }}
          path: |
            target/windows-dist/Codex-Auth-Switcher-*-windows-x64-setup.exe
            target/windows-dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

  package-linux:
    name: Package (Linux x86_64)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Read Rust toolchain from rust-toolchain.toml
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)"
          [[ -n "$toolchain" ]]
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}

      - name: Report toolchain and architecture
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustup run stable rustc -vV | sed -n 's/^host: //p')
          [[ "$host" == "x86_64-unknown-linux-gnu" ]]
          rustup run stable rustc -Vv
          rustup run stable cargo -V
          uname -m

      - name: Restore Cargo download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux desktop and package dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            curl \
            desktop-file-utils \
            dpkg \
            dpkg-dev \
            file \
            jq \
            libasound2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libzstd-dev \
            ninja-build \
            patchelf \
            pkg-config \
            shellcheck \
            squashfs-tools \
            xz-utils

      - name: Check Linux and release scripts
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -x scripts/package-linux.sh scripts/package-metadata.sh scripts/linux/*.sh scripts/release/*.sh
          bash scripts/linux/package-tests.sh
          bash scripts/release/test-release-scripts.sh

      - name: Build and verify Linux packages
        shell: bash
        run: bash scripts/package-linux.sh

      - name: Upload verified Linux packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-auth-switcher-linux-${{ github.run_id }}
          path: |
            target/linux-dist/Codex-Auth-Switcher-*-linux-amd64.deb
            target/linux-dist/Codex-Auth-Switcher-*-linux-x86_64.AppImage
            target/linux-dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

  package-macos:
    name: Package (macOS ${{ matrix.architecture }})
    needs: quality
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            architecture: arm64
            rust_target: aarch64-apple-darwin
          - os: macos-15-intel
            architecture: x86_64
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Read Rust toolchain from rust-toolchain.toml
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)"
          [[ -n "$toolchain" ]]
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable toolchain and target
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
          target: ${{ matrix.rust_target }}

      - name: Report toolchain and architecture
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustup run stable rustc -vV | sed -n 's/^host: //p')
          [[ "$host" == "${{ matrix.rust_target }}" ]]
          rustup run stable rustc -Vv
          rustup run stable cargo -V
          uname -m
          xcodebuild -version

      - name: Restore Cargo download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            release-cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Check macOS package scripts
        shell: bash
        run: bash scripts/macos/package-tests.sh

      - name: Build and verify macOS package
        shell: bash
        run: bash scripts/package-macos.sh --architecture "${{ matrix.architecture }}"

      - name: Upload verified macOS package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-auth-switcher-macos-${{ matrix.architecture }}-${{ github.run_id }}
          path: |
            target/macos-dist/Codex-Auth-Switcher-*-macos-${{ matrix.architecture }}.dmg
            target/macos-dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

  publish:
    name: Publish verified GitHub Release
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs:
      - quality
      - package-windows
      - package-linux
      - package-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.sha }}

      - name: Download verified Windows package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-auth-switcher-windows-${{ github.run_id }}
          path: release-input/windows

      - name: Download verified Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-auth-switcher-linux-${{ github.run_id }}
          path: release-input/linux

      - name: Download verified macOS arm64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-auth-switcher-macos-arm64-${{ github.run_id }}
          path: release-input/macos-arm64

      - name: Download verified macOS x86_64 package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: codex-auth-switcher-macos-x86_64-${{ github.run_id }}
          path: release-input/macos-x86_64

      - name: Validate release tag and generate bilingual notes
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tag must be a v-prefixed semantic version: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          manifest_version="$(
            awk '
              /^\[workspace\.package\]$/ { in_workspace_package = 1; next }
              /^\[/ { in_workspace_package = 0 }
              in_workspace_package && /^[[:space:]]*version[[:space:]]*=/ {
                line = $0
                sub(/^[^"]*"/, "", line)
                sub(/".*$/, "", line)
                print line
                exit
              }
            ' Cargo.toml
          )"
          [[ "$manifest_version" == "$version" ]] || {
            echo "Release tag $RELEASE_TAG does not match Cargo workspace version $manifest_version." >&2
            exit 1
          }
          tag_object_type=$(git cat-file -t "refs/tags/$RELEASE_TAG")
          [[ "$tag_object_type" == "tag" ]] || {
            echo "Release tag $RELEASE_TAG must be annotated." >&2
            exit 1
          }
          tag_commit=$(git rev-parse --verify "$RELEASE_TAG^{}")
          head_commit=$(git rev-parse --verify HEAD)
          [[ "$tag_commit" == "$head_commit" ]] || {
            echo "Checked out commit does not match the release tag commit." >&2
            exit 1
          }
          shellcheck -x scripts/release/*.sh
          bash scripts/release/test-release-scripts.sh
          bash scripts/release/generate-notes.sh "$RELEASE_TAG" "$GH_REPO" release-notes.md

      - name: Aggregate and verify all five packages
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/release/aggregate-assets.sh \
            "${{ inputs.release_tag || github.ref_name }}" \
            release-notes.md \
            release-assets \
            release-input/windows \
            release-input/linux \
            release-input/macos-arm64 \
            release-input/macos-x86_64

      - name: Create or update release and verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/release/publish-assets.sh \
            "${{ inputs.release_tag || github.ref_name }}" \
            "${{ github.repository }}" \
            release-assets \
            release-notes.md
