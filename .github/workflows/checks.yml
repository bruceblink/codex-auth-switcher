name: Cross-platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: codex-auth-switcher-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - ubuntu-24.04
          - macos-15
          - macos-15-intel
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          components: clippy, rustfmt

      - name: Initialize and verify Windows MSVC/CMake environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\enable-windows-msvc.ps1

      - name: Report toolchain and architecture
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Windows/X64) expected_host=x86_64-pc-windows-msvc ;;
            Linux/X64) expected_host=x86_64-unknown-linux-gnu ;;
            macOS/ARM64) expected_host=aarch64-apple-darwin ;;
            macOS/X64) expected_host=x86_64-apple-darwin ;;
            *) echo "Unsupported runner architecture: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          [[ "$host" == "$expected_host" ]] || {
            echo "Expected Rust host $expected_host, found $host." >&2
            exit 1
          }
          rustc -Vv
          uname -m

      - name: Restore Cargo download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libzstd-dev \
            ninja-build \
            pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all workspace targets
        run: cargo check --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

  package:
    name: Package (${{ matrix.os }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            binary_arch: x86_64
            binary_glob: dist/codex-auth-switcher-*-windows-*.exe
          - os: ubuntu-24.04
            binary_arch: x86_64
            binary_glob: dist/codex-auth-switcher-*-linux-x64
          - os: macos-15
            binary_arch: arm64
            binary_glob: dist/codex-auth-switcher-*-macos-arm64
          - os: macos-15-intel
            binary_arch: x86_64
            binary_glob: dist/codex-auth-switcher-*-macos-x64
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable

      - name: Initialize and verify Windows MSVC/CMake environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\enable-windows-msvc.ps1

      - name: Report toolchain and architecture
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Windows/X64) expected_host=x86_64-pc-windows-msvc ;;
            Linux/X64) expected_host=x86_64-unknown-linux-gnu ;;
            macOS/ARM64) expected_host=aarch64-apple-darwin ;;
            macOS/X64) expected_host=x86_64-apple-darwin ;;
            *) echo "Unsupported runner architecture: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          [[ "$host" == "$expected_host" ]] || {
            echo "Expected Rust host $expected_host, found $host." >&2
            exit 1
          }
          rustc -Vv
          uname -m

      - name: Restore Cargo download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libzstd-dev \
            ninja-build \
            pkg-config

      - name: Build and package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package-windows.ps1

      - name: Build and package Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/package-unix.sh

      - name: Test packaged native Windows UI
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\test-v2-native-ui.ps1 -ExecutablePath .\target\release\codex-auth-switcher.exe

      - name: Verify Windows executable checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Path '${{ matrix.binary_glob }}' | Select-Object -First 1
          $checksum = Get-ChildItem -Path '${{ matrix.binary_glob }}.sha256' | Select-Object -First 1
          $expected = (Get-Content -Raw -LiteralPath $checksum.FullName).Trim().Split()[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $binary.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Windows executable checksum mismatch." }

      - name: Verify Unix executable checksum
        if: runner.os != 'Windows'
        shell: bash
        run: |
          checksum=$(compgen -G '${{ matrix.binary_glob }}.sha256' | head -n 1)
          binary=${checksum%.sha256}
          test -x "$binary"
          file "$binary"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            lipo "$binary" -verify_arch "${{ matrix.binary_arch }}"
          else
            readelf -h "$binary" | grep -q 'Advanced Micro Devices X86-64'
          fi
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then sha256sum -c "$(basename "$checksum")"; else shasum -a 256 -c "$(basename "$checksum")"; fi

      - name: Upload raw executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ matrix.binary_glob }}
          archive: false
          if-no-files-found: error

      - name: Upload executable checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ matrix.binary_glob }}.sha256
          archive: false
          if-no-files-found: error
