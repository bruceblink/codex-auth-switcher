name: Release executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Existing branch, commit, or v* tag to package"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: codex-auth-switcher-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Package ${{ matrix.platform }} ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: windows
            architecture: x64
            binary_arch: x86_64
            expected_host: x86_64-pc-windows-msvc
            binary_glob: dist/codex-auth-switcher-*-windows-x64.exe
          - os: ubuntu-24.04
            platform: linux
            architecture: x64
            binary_arch: x86_64
            expected_host: x86_64-unknown-linux-gnu
            binary_glob: dist/codex-auth-switcher-*-linux-x64
          - os: macos-15
            platform: macos
            architecture: arm64
            binary_arch: arm64
            expected_host: aarch64-apple-darwin
            binary_glob: dist/codex-auth-switcher-*-macos-arm64
          - os: macos-15-intel
            platform: macos
            architecture: x64
            binary_arch: x86_64
            expected_host: x86_64-apple-darwin
            binary_glob: dist/codex-auth-switcher-*-macos-x64
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_ref || github.ref }}

      - name: Read Rust toolchain from rust-toolchain.toml
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)"
          [[ -n "$toolchain" ]]
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}

      - name: Initialize and verify Windows MSVC/CMake environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\enable-windows-msvc.ps1

      - name: Report toolchain and architecture
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustc -vV | sed -n 's/^host: //p')
          [[ "$host" == "${{ matrix.expected_host }}" ]] || {
            echo "Expected Rust host ${{ matrix.expected_host }}, found $host." >&2
            exit 1
          }
          rustc -vV
          uname -m

      - name: Restore Cargo download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: release-${{ matrix.platform }}-${{ matrix.architecture }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            release-${{ matrix.platform }}-${{ matrix.architecture }}-

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            clang \
            cmake \
            libasound2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libzstd-dev \
            ninja-build \
            pkg-config

      - name: Verify release tag version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          expected_version="${GITHUB_REF_NAME#v}"
          [[ -n "$version" && "$version" == "$expected_version" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $version." >&2
            exit 1
          }

      - name: Build and package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\package-windows.ps1

      - name: Build and package Unix release
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/package-unix.sh

      - name: Test packaged native Windows UI
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\test-v2-native-ui.ps1 -ExecutablePath .\target\release\codex-auth-switcher.exe

      - name: Verify Windows executable checksum
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binaries = @(Get-ChildItem -Path '${{ matrix.binary_glob }}' -File)
          $checksums = @(Get-ChildItem -Path '${{ matrix.binary_glob }}.sha256' -File)
          if ($binaries.Count -ne 1 -or $checksums.Count -ne 1) {
            throw "Expected one Windows executable and checksum file."
          }
          $expected = (Get-Content -Raw -LiteralPath $checksums[0].FullName).Trim().Split()[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $binaries[0].FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Windows executable checksum mismatch." }

      - name: Verify Unix executable checksum and architecture
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          checksums=( ${{ matrix.binary_glob }}.sha256 )
          [[ ${#checksums[@]} -eq 1 ]]
          checksum=${checksums[0]}
          binary=${checksum%.sha256}
          [[ -f "$binary" ]]
          test -x "$binary"
          file "$binary"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            lipo "$binary" -verify_arch "${{ matrix.binary_arch }}"
          else
            readelf -h "$binary" | grep -q 'Advanced Micro Devices X86-64'
          fi
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "$(basename "$checksum")"
          else
            shasum -a 256 -c "$(basename "$checksum")"
          fi

      - name: Upload raw executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-auth-switcher-${{ matrix.platform }}-${{ matrix.architecture }}-binary
          path: ${{ matrix.binary_glob }}
          archive: false
          if-no-files-found: error
          retention-days: 90

      - name: Upload executable checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-auth-switcher-${{ matrix.platform }}-${{ matrix.architecture }}-checksum
          path: ${{ matrix.binary_glob }}.sha256
          archive: false
          if-no-files-found: error
          retention-days: 90
