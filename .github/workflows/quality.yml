name: Rust quality checks

on:
  workflow_call:
    inputs:
      ref:
        description: "Source ref to validate"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Read Rust toolchain from rust-toolchain.toml
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$(awk -F '"' '/^[[:space:]]*channel[[:space:]]*=/ { print $2; exit }' rust-toolchain.toml)"
          [[ -n "$toolchain" ]]
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.toolchain }}
          components: clippy, rustfmt

      - name: Initialize and verify Windows MSVC/CMake environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\enable-windows-msvc.ps1

      - name: Test Windows MSVC linker precedence
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\test-enable-windows-msvc.ps1

      - name: Report toolchain and architecture
        shell: bash
        run: |
          set -euo pipefail
          host=$(rustup run stable rustc -vV | sed -n 's/^host: //p')
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Windows/X64) expected_host=x86_64-pc-windows-msvc ;;
            Linux/X64) expected_host=x86_64-unknown-linux-gnu ;;
            macOS/ARM64) expected_host=aarch64-apple-darwin ;;
            *) echo "Unsupported runner architecture: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          [[ "$host" == "$expected_host" ]] || {
            echo "Expected Rust host $expected_host, found $host." >&2
            exit 1
          }
          rustup run stable rustc -Vv
          rustup run stable cargo -V
          uname -m

      - name: Restore Cargo download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: quality-cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            quality-cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            libasound2-dev \
            libdbus-1-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libvulkan1 \
            libwayland-dev \
            libwebkit2gtk-4.1-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxinerama-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxrandr-dev \
            libzstd-dev \
            ninja-build \
            openssl \
            pkg-config

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all workspace targets
        run: cargo check --workspace --all-targets --locked

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

      - name: Test update downloads with local Docker HTTPS
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/update/test-local-integration.ps1
