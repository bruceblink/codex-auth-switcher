[package]
name = "switcher-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "codex-auth-switcher"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
switcher-core = { path = "../switcher-core" }
gpui-kit.workspace = true
anyhow.workspace = true
serde_json.workspace = true
rfd = "0.15"
clap = { version = "4.5", features = ["derive"] }
tempfile.workspace = true
zeroize.workspace = true

[dev-dependencies]
gpui-test = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
gpui-base = { version = "=0.7.3", features = ["test-support"] }
gpui-component = { version = "=0.7.3", features = ["test-support"] }
