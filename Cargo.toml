[workspace]
resolver = "3"
members = ["crates/switcher-core", "crates/switcher-desktop"]
default-members = ["crates/switcher-desktop"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.99.1"
repository = "https://github.com/bruceblink/codex-auth-switcher"
license = "GPL-3.0-only"

[workspace.dependencies]
gpui-kit = "=0.8.1"
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
directories = "6"
fs2 = "0.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream", "system-proxy"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
toml_edit = "0.25"
url = "2"
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 0

[profile.release]
opt-level = "s"
strip = true
lto = "thin"
